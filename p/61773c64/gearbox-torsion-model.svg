<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">两惯量扭振模型与频率计算示意</title><desc id="desc">两个等效转动惯量通过扭转刚度连接。J1为10千克平方米，J2为40千克平方米，k为40000牛米每弧度，教学固有频率约11.3赫兹。</desc>
<rect width="1200" height="430" fill="#f1f8f7"/><g font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" fill="#153b49"><text x="54" y="60" font-size="28" font-weight="700">两惯量扭振：先找模态，再扫转速</text><text x="54" y="91" font-size="16">同一侧等效坐标的理想无阻尼教学模型；不代表任何已认证发动机的实际参数。</text>
<circle cx="240" cy="220" r="75" fill="#226978"/><circle cx="930" cy="220" r="107" fill="#315983"/><path d="M315 220H397l18-40 38 80 38-80 38 80 38-80 38 80 38-80 18 40h208" fill="none" stroke="#ef9c52" stroke-width="13" stroke-linejoin="round"/><text x="180" y="229" fill="white" font-size="22">J₁=10</text><text x="867" y="229" fill="white" font-size="22">J₂=40</text><text x="535" y="151" font-size="21">kₜ=40,000 N·m/rad</text><text x="172" y="334" font-size="17">低压轴侧等效惯量</text><text x="852" y="358" font-size="17">风扇侧等效惯量</text><text x="446" y="376" font-size="23" font-weight="700">fₙ = √[kₜ(1/J₁+1/J₂)] / 2π ≈ 11.3 Hz</text></g></svg>
