<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810"><rect width="100%" height="100%" fill="#f7fafc"/><style>text{font-family:'Microsoft YaHei',sans-serif;fill:#17324d}.t{font-size:42px;font-weight:700}.h{font-size:27px;font-weight:700}.p{font-size:22px}.b{fill:#e8f1f5;stroke:#2878b5;stroke-width:4}.c{fill:#e9f4ef;stroke:#3b8d78;stroke-width:4}.w{fill:#fff3e5;stroke:#e38b2c;stroke-width:4}.a{stroke:#2878b5;stroke-width:7;fill:none;marker-end:url(#m)}.ac{stroke:#3b8d78;stroke-width:7;fill:none;marker-end:url(#g)}</style><defs><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#2878b5"/></marker><marker id="g" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#3b8d78"/></marker></defs><text x="70" y="75" class="t">涡轮冷却流量如何进入部件匹配</text><rect x="80" y="180" width="260" height="145" rx="24" class="b"/><text x="135" y="240" class="h">压气机</text><text x="110" y="285" class="p">m2, Pt, Tt, 功输入</text><rect x="485" y="180" width="260" height="145" rx="24" class="w"/><text x="530" y="240" class="h">燃烧室</text><text x="515" y="285" class="p">mg = m3 + mf</text><rect x="900" y="180" width="390" height="145" rx="24" class="b"/><text x="970" y="240" class="h">涡轮逐排匹配</text><text x="930" y="285" class="p">加气、掺混、转子功、效率</text><path d="M340 252H485" class="a"/><path d="M745 252H900" class="a"/><rect x="315" y="480" width="330" height="175" rx="24" class="c"/><text x="370" y="535" class="h">冷却供气网络</text><text x="345" y="585" class="p">抽气站位 → 管路压损</text><text x="345" y="625" class="p">旋转腔 → 叶内通道 → 孔口</text><path d="M210 325V430H410V480" class="ac"/><path d="M645 565H820V325H960" class="ac"/><rect x="865" y="485" width="425" height="175" rx="24" class="w"/><text x="915" y="540" class="h">每次加气后重新闭合</text><text x="900" y="590" class="p">质量流、总焓、总压、速度三角形</text><text x="900" y="630" class="p">高/低压轴功与喷管流量</text><text x="80" y="750" class="p">原则：每股冷气都有明确抽取站位、供压、排出叶排与损失模型；概念阶段可集总，详细设计应逐排。</text></svg>
