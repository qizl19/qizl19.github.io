<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810"><rect width="100%" height="100%" fill="#fff"/><style>text{font-family:'Microsoft YaHei',sans-serif;fill:#17324d}.t{font-size:42px;font-weight:700}.h{font-size:29px;font-weight:700}.p{font-size:23px}.n{font-size:34px;font-weight:700;fill:#c9574d}.line{stroke:#8aa1af;stroke-width:3}.box{fill:#edf3f6;stroke:#2878b5;stroke-width:4}</style><text x="70" y="72" class="t">孔口堵塞判定与混合温度：透明示教算例</text><rect x="70" y="135" width="620" height="570" rx="28" class="box"/><text x="115" y="205" class="h">1｜压比与冷气流量</text><text x="115" y="270" class="p">pb / Pt = 0.70 / 1.60 =</text><text x="510" y="270" class="n">0.4375</text><text x="115" y="325" class="p">gamma=1.4 的临界压比约</text><text x="500" y="325" class="n">0.528</text><line x1="115" y1="365" x2="640" y2="365" class="line"/><text x="115" y="420" class="p">0.4375 &lt; 0.528 → 孔口堵塞</text><text x="115" y="480" class="p">Cd=0.72，A=400 mm2</text><text x="115" y="530" class="p">Pt=1.60 MPa，Tt=800 K</text><text x="115" y="600" class="p">计算冷气流量 mc 约</text><text x="485" y="600" class="n">0.93 kg/s</text><text x="115" y="655" class="p">占50 kg/s压气机流量：</text><text x="500" y="655" class="n">1.86%</text><rect x="750" y="135" width="620" height="570" rx="28" class="box"/><text x="795" y="205" class="h">2｜理想等cp掺混</text><text x="795" y="275" class="p">热主流：49.5 kg/s，1700 K</text><text x="795" y="330" class="p">冷却气：0.93 kg/s，800 K</text><line x1="795" y1="375" x2="1320" y2="375" class="line"/><text x="795" y="435" class="p">Tmix = (mg Tg + mc Tc)/(mg + mc)</text><text x="795" y="515" class="p">混合总温约</text><text x="1015" y="515" class="n">1683.4 K</text><text x="795" y="585" class="p">相对热主流下降约</text><text x="1080" y="585" class="n">16.6 K</text><text x="795" y="655" class="p">未计：总压损失、动量差、变cp与逐排转子功</text><text x="70" y="770" class="p">所有数值均为教学假设，不对应在役发动机；公式适用于稳态、准一维、理想气体、绝热孔口的初步估算。</text></svg>
