<rect x="324" y="106" width="205" height="90" rx="12" fill="#dceefe" stroke="#2873ab" stroke-width="3"/><text x="345" y="145" font-size="23">BOOSTER</text><text x="345" y="175" font-size="17">60 kg/s · +50 K</text>
