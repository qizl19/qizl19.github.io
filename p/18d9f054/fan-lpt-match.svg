<path d="M625 220H70" stroke="#7551a8" stroke-width="9"/><path d="M70 220l18-10v20z" fill="#7551a8"/><text x="326" y="251" font-size="18">same shaft speed · N<tspan baseline-shift="sub" font-size="12">L</tspan></text>
