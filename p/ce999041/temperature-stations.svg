   <g id="text_1">
    <text style="fill: #15344a; font: 700 21px 'Microsoft YaHei'; text-anchor: start" x="32.31" y="32.148" transform="rotate(-0 32.31 32.148)">从 T3 到 EGT：温度名称必须绑定测点</text>
   </g>
   <g id="text_2">
    <text style="fill: #61727d; font: 10.5px 'Microsoft YaHei'; text-anchor: start" x="32.31" y="52.6608" transform="rotate(-0 32.31 52.6608)">NASA 站位定义 + 认证/驾驶舱测量口径；箭头只表示主流方向，非几何比例</text>
   </g>
   <g id="text_3">
    <text style="fill: #2878b5; font: 700 11px 'Microsoft YaHei'; text-anchor: middle" x="93.69" y="124.101125" transform="rotate(-0 93.69 124.101125)">压气机出口</text>
   </g>
   <g id="text_4">
    <text style="fill: #15344a; font: 700 14px 'Microsoft YaHei'; text-anchor: middle" x="93.69" y="143.002669" transform="rotate(-0 93.69 143.002669)">Tt3 / T3</text>
   </g>
   <g id="text_5">
    <text style="fill: #61727d; font: 8.6px 'Microsoft YaHei'" transform="translate(72.19 158.300244)">燃烧室入口</text>
    <text style="fill: #61727d; font: 8.6px 'Microsoft YaHei'" transform="translate(54.99 169.718894)">压比和效率决定温升</text>
   </g>
   <g id="text_6">
    <text style="fill: #c8574d; font: 700 11px 'Microsoft YaHei'; text-anchor: middle" x="230.4" y="124.101125" transform="rotate(-0 230.4 124.101125)">燃烧室出口</text>
   </g>
   <g id="text_7">
    <text style="fill: #15344a; font: 700 14px 'Microsoft YaHei'; text-anchor: middle" x="230.4" y="143.002669" transform="rotate(-0 230.4 143.002669)">Tt4 / T4 / TIT</text>
   </g>
   <g id="text_8">
    <text style="fill: #61727d; font: 8.6px 'Microsoft YaHei'" transform="translate(204.6 158.300244)">涡轮入口总温</text>
    <text style="fill: #61727d; font: 8.6px 'Microsoft YaHei'" transform="translate(176.963094 169.718894)">常为模型/推算而非直接测量</text>
   </g>
   <g id="text_9">
    <text style="fill: #df8a32; font: 700 11px 'Microsoft YaHei'; text-anchor: middle" x="367.11" y="124.101125" transform="rotate(-0 367.11 124.101125)">高压涡轮后</text>
   </g>
   <g id="text_10">
    <text style="fill: #15344a; font: 700 14px 'Microsoft YaHei'; text-anchor: middle" x="367.11" y="143.002669" transform="rotate(-0 367.11 143.002669)">T4.5（示例）</text>
   </g>
   <g id="text_11">
    <text style="fill: #61727d; font: 8.6px 'Microsoft YaHei'" transform="translate(324.11 158.300244)">温度已因轴功提取下降</text>
    <text style="fill: #61727d; font: 8.6px 'Microsoft YaHei'" transform="translate(324.11 169.718894)">编号随制造商定义变化</text>
   </g>
   <g id="text_12">
    <text style="fill: #3c8c78; font: 700 11px 'Microsoft YaHei'; text-anchor: middle" x="503.82" y="124.101125" transform="rotate(-0 503.82 124.101125)">低压涡轮入口/后部</text>
   </g>
   <g id="text_13">
    <text style="fill: #15344a; font: 700 14px 'Microsoft YaHei'; text-anchor: middle" x="503.82" y="143.002669" transform="rotate(-0 503.82 143.002669)">T49 / ITT（实例）</text>
   </g>
   <g id="text_14">
    <text style="fill: #61727d; font: 8.6px 'Microsoft YaHei'" transform="translate(453.061859 158.300244)">GE90 T49 是认证指示温度</text>
    <text style="fill: #61727d; font: 8.6px 'Microsoft YaHei'" transform="translate(480.360813 169.718894)">并不等于 T4</text>
   </g>
   <g id="text_15">
    <text style="fill: #4ca6c7; font: 700 11px 'Microsoft YaHei'; text-anchor: middle" x="622.395" y="124.101125" transform="rotate(-0 622.395 124.101125)">排气段</text>
   </g>
   <g id="text_16">
    <text style="fill: #15344a; font: 700 14px 'Microsoft YaHei'; text-anchor: middle" x="622.395" y="143.002669" transform="rotate(-0 622.395 143.002669)">EGT / T5</text>
   </g>
   <g id="text_17">
    <text style="fill: #61727d; font: 8.6px 'Microsoft YaHei'" transform="translate(600.895 158.300244)">多支热电偶</text>
    <text style="fill: #61727d; font: 8.6px 'Microsoft YaHei'" transform="translate(605.195 169.718894)">环向平均</text>
   </g>
   <g id="text_18">
    <text style="fill: #2878b5; font: 700 12px 'Microsoft YaHei'; text-anchor: start" x="54.63" y="257.7888" transform="rotate(-0 54.63 257.7888)">总温 vs. 静温</text>
   </g>
   <g id="text_19">
    <text style="fill: #15344a; font: 700 16px 'Microsoft YaHei'; text-anchor: start" x="54.63" y="279.9648" transform="rotate(-0 54.63 279.9648)">Tt = T + V²/(2cp)</text>
   </g>
   <g id="text_20">
    <text style="fill: #61727d; font: 10px 'Microsoft YaHei'; text-anchor: start" x="54.63" y="303.2496" transform="rotate(-0 54.63 303.2496)">必须写清 total/static；高速流中两者不可互换。</text>
   </g>
   <g id="text_21">
    <text style="fill: #61727d; font: 10px 'Microsoft YaHei'; text-anchor: start" x="54.63" y="321.5448" transform="rotate(-0 54.63 321.5448)">同一个“EGT”也必须带具体发动机、测点、平均方式与限制时间。</text>
   </g>
   <g id="text_22">
    <text style="fill: #df8a32; font: 700 12px 'Microsoft YaHei'; text-anchor: start" x="358.74" y="257.7888" transform="rotate(-0 358.74 257.7888)">读数链路</text>
   </g>
   <g id="text_23">
    <text style="fill: #15344a; font: 10.5px 'Microsoft YaHei'; text-anchor: start" x="358.74" y="281.0736" transform="rotate(-0 358.74 281.0736)">燃气真实场 → 探针/热电偶 → 环向平均 → 校正/FADEC → 驾驶舱</text>
   </g>
   <g id="text_24">
    <text style="fill: #61727d; font: 10px 'Microsoft YaHei'; text-anchor: start" x="358.74" y="305.4672" transform="rotate(-0 358.74 305.4672)">测得较低位置温度不代表能直接倒推出 T4；需经型号批准的相关关系。</text>
   </g>
   <g id="text_25">
    <text style="fill: #61727d; font: 10px 'Microsoft YaHei'; text-anchor: start" x="358.74" y="323.7624" transform="rotate(-0 358.74 323.7624)">FAA：大型发动机常在涡轮排气处测温，以相对监视热端状态。</text>
   </g>
  </g>
 </g>
