   <g id="text_28">
    <text style="fill: #15344a; font: 9.5px 'Microsoft YaHei'" transform="translate(459.018585 392.990666)">NASA NASALIFE：寿命预测需要温度相关材料性能、蠕变断裂和循环疲劳数据；</text>
