<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">PW1100G-JM齿轮风扇功率路径教学示意</title>
  <desc id="desc">低压涡轮驱动低压压气机，并经减速齿轮驱动风扇；高压涡轮驱动高压压气机。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07172b"/><stop offset="1" stop-color="#123f51"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#ffbd5a"/></marker></defs>
  <rect width="1400" height="720" rx="34" fill="url(#bg)"/>
  <g font-family="Microsoft YaHei,Arial,sans-serif" fill="#e9f5ff">
    <text x="70" y="80" font-size="34" font-weight="700">齿轮风扇把“合适转速”拆成两个机械自由度</text>
    <text x="70" y="122" font-size="19" fill="#a8c6d8">教学示意，不按比例；公开资料未确认逐级几何与完整控制律</text>
  </g>
  <g stroke="#73d2de" stroke-width="4" fill="#113249">
    <rect x="70" y="250" width="170" height="170" rx="85"/><rect x="330" y="270" width="180" height="130" rx="22"/>
    <rect x="600" y="270" width="170" height="130" rx="22"/><rect x="850" y="270" width="170" height="130" rx="22"/>
    <rect x="1110" y="270" width="210" height="130" rx="22"/>
  </g>
  <g font-family="Microsoft YaHei,Arial,sans-serif" fill="#fff" text-anchor="middle">
    <text x="155" y="328" font-size="28" font-weight="700">风扇</text><text x="155" y="362" font-size="18">较低转速</text>
    <text x="420" y="325" font-size="25" font-weight="700">减速齿轮</text><text x="420" y="358" font-size="18">分离风扇与低压轴转速</text>
    <text x="685" y="325" font-size="24" font-weight="700">低压压气机</text><text x="685" y="358" font-size="18">3级</text>
    <text x="935" y="325" font-size="24" font-weight="700">核心机</text><text x="935" y="358" font-size="18">8级HPC + 燃烧室</text>
    <text x="1215" y="325" font-size="24" font-weight="700">涡轮</text><text x="1215" y="358" font-size="18">2级HPT + 3级LPT</text>
  </g>
  <g stroke="#ffbd5a" stroke-width="7" fill="none" marker-end="url(#arrow)">
    <path d="M1120 455C950 610 650 610 470 425"/><path d="M1110 210C1010 150 930 160 925 260"/>
  </g>
  <g font-family="Microsoft YaHei,Arial,sans-serif" fill="#ffda91">
    <text x="720" y="615" font-size="23" text-anchor="middle">LPT → 高速低压轴 → 齿轮 → 低速风扇</text>
    <text x="1000" y="175" font-size="21" text-anchor="middle">HPT → HPC</text>
  </g>
  <g font-family="Microsoft YaHei,Arial,sans-serif" fill="#b7d2df" font-size="19">
    <text x="75" y="680">关键取舍：齿轮损失/热管理/寿命/扭矩限制 ↔ 风扇效率、LPT级数与转子转速自由度</text>
  </g>
</svg>
